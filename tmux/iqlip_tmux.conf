# ============================================================
#  TMUX CONFIG — iqlip
# ============================================================

# ---- Core -------------------------------------------------
set -g prefix C-a
bind C-a send-prefix
unbind C-b

set -g history-limit 50000
set -g allow-rename off
set-option -g renumber-windows on
set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -s set-clipboard on
set -g base-index 1
setw -g pane-base-index 1

# ---- Truecolor --------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"

# ---- Vi mode ----------------------------------------------
setw -g mode-keys vi

# ============================================================
#  KEYBINDINGS
# ============================================================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# manual HTB box refresh
bind F run-shell '"$HOME/Scripts/htb_refresh.sh"' \; refresh-client -S \; display 'HTB: box refreshed'

bind-key -n C-S-Left  swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind -T copy-mode-vi v     send-keys -X begin-selection
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -T copy-mode-vi C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi C-WheelDownPane send-keys -X halfpage-down

# ============================================================
#  THEME — Catppuccin Mocha, transparent + pill tabs
# ============================================================
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#cdd6f4"

# session pill + HTB box name (left)
set -g status-left-length 60
set -g status-left "#[fg=#a6e3a1]#[fg=#11111b,bg=#a6e3a1,bold] #S #[fg=#a6e3a1,bg=default]  #(~/Scripts/htb_name.sh) "
set -g status-right-length 120

# windows — rounded pills (grey = inactive, pink = active)
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#313244,bg=default]#[fg=#cdd6f4,bg=#313244] #I #W #[fg=#313244,bg=default]"
setw -g window-status-current-format "#[fg=#f38ba8,bg=default]#[fg=#11111b,bg=#f38ba8,bold] #I #W #[fg=#f38ba8,bg=default]"
setw -g window-status-activity-style "fg=#f9e2af"

# right — vpn · ip-toggle · flags · handle
set -g status-right "\
#(~/Scripts/vpnIP_VM.sh)  \
#[range=user|ip]#(~/Scripts/ip_toggle.sh)#[norange,default]  \
#[fg=#6c7086]#{?client_prefix,󰌆 ,}#{?window_zoomed_flag,󰊓 ,}#{?pane_synchronized,SYNC ,}\
#[fg=#ffd700] #[fg=#9fef00]crispypotato "

# panes
set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#f38ba8"
set -g pane-border-lines single

# messages / copy-mode / clock
set -g message-style         "fg=#cdd6f4,bg=#313244"
set -g message-command-style "fg=#cdd6f4,bg=#313244"
setw -g mode-style           "fg=#11111b,bg=#f38ba8"
setw -g clock-mode-colour    "#89b4fa"

# ============================================================
#  IP TOGGLE — click the IP to flip local <-> box
# ============================================================
set -g @ip_mode local
bind -n MouseDown1Status {
  if -F '#{==:#{mouse_status_range},ip}' {
    if -F '#{==:#{@ip_mode},box}' 'set -g @ip_mode local' 'set -g @ip_mode box'
    refresh-client -S
  } {
    select-window -t=
  }
}

# styled rename popup
bind , display-popup -E -w 44 -h 4 \
  -b rounded \
  -S "fg=#9fef00" \
  -s "bg=default" \
  -T "#[fg=#9fef00,bold]  rename window " \
  'printf "\033[1;32m~ \033[0m"; read -r n && [ -n "$n" ] && tmux rename-window "$n"'

# styled rename-session popup
bind '$' display-popup -E -w 44 -h 4 \
  -b rounded \
  -S "fg=#9fef00" \
  -s "bg=default" \
  -T "#[fg=#9fef00,bold] rename session #S " \
  'printf "\033[1;32m~ \033[0m"; read -r n && [ -n "$n" ] && tmux rename-session "$n"'

# styled kill-pane popup (y = kill, any other key = cancel)
bind x display-popup -E -w 32 -h 3 \
  -b rounded \
  -S "fg=#f38ba8" \
  -s "bg=default" \
  -T "#[fg=#f38ba8,bold] window #I · pane #P " \
  'printf "\033[1;31m kill this pane? \033[0m(y/n) "; stty -icanon -echo; k=$(dd bs=1 count=1 2>/dev/null); case "$k" in y|Y) tmux kill-pane ;; esac'

# styled kill-window popup (y = kill, any other key = cancel)
bind & display-popup -E -w 32 -h 3 \
  -b rounded \
  -S "fg=#f38ba8" \
  -s "bg=default" \
  -T "#[fg=#f38ba8,bold] window #I · #W " \
  'printf "\033[1;31m kill this window? \033[0m(y/n) "; stty -icanon -echo; k=$(dd bs=1 count=1 2>/dev/null); case "$k" in y|Y) tmux kill-window ;; esac'

# search popups in scroll/copy mode (/ = down, ? = up; empty Enter cancels)
bind -T copy-mode-vi / display-popup -E -w 44 -h 3 \
  -b rounded \
  -S "fg=#f9e2af" \
  -s "bg=default" \
  -T "#[fg=#f9e2af,bold] search down " \
  'printf "\033[1;33m/ \033[0m"; read -r q && [ -n "$q" ] && tmux send-keys -X search-forward "$q"'

bind -T copy-mode-vi ? display-popup -E -w 44 -h 3 \
  -b rounded \
  -S "fg=#f9e2af" \
  -s "bg=default" \
  -T "#[fg=#f9e2af,bold] search up " \
  'printf "\033[1;33m? \033[0m"; read -r q && [ -n "$q" ] && tmux send-keys -X search-backward "$q"'

# cheat sheet popup (any key closes it)
bind h display-popup -E -w 93 -h 29 \
  -b rounded \
  -S "fg=#cba6f7" \
  -s "bg=default" \
  -T "#[fg=#cba6f7,bold] tmux cheat sheet " \
  '~/Scripts/tmux_cheatsheet.sh'

# ---- Reload----
unbind r
bind r source-file ~/.tmux.conf \; display-popup -E -B -w 24 -h 1 \
  -s "bg=default" \
  'printf "\033[?25l\033[1;32m Config Reloaded\033[0m"; sleep 0.8'

